<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading | Discover Destination</title>
<link rel="shortcut icon" href="./assets/images/titleLogo.png" type="image/svg+xml">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}
.hero{
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 40px;
    overflow: hidden;
}

.hero::before{
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('./assets/images/bgc.png') no-repeat center center;
    background-size: cover;
    
    filter: blur(2px); /* 👈 blur yaha control karo */
    transform: scale(1.1); /* edges cut na ho */
}

.hero *{
    position: relative;
    z-index: 1;
}



/* ===== CENTER CONTAINER ===== */
.container{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  flex-direction:column;
  color:rgb(86, 56, 237);
}

/* ===== GLASS CARD ===== */
.glass{
  padding:50px;
  border-radius:25px;
  backdrop-filter:blur(20px);
  background:rgba(67, 213, 140, 0.1);
  box-shadow:0 15px 50px rgba(53, 30, 164, 0.5);
  animation:fadeIn 2s ease;
}

/* ===== FLOATING LOGO ===== */
.logo{
  width:170px;
margin-bottom: -25px;
  animation:float 4s ease-in-out infinite;
}

/* ===== TITLE ===== */
h1{
  font-size:28px;
  letter-spacing:2px;
  margin-bottom:20px;
}

/* ===== CIRCULAR LOADER ===== */
.loader{
  width:60px;
  height:60px;
  border:5px solid rgba(255,255,255,0.3);
  border-top:5px solid rgb(243, 54, 20);
  border-radius:50%;
  margin:20px auto;
  animation:spin 1s linear infinite;
}

/* ===== ANIMATIONS ===== */
@keyframes spin{
  to{transform:rotate(360deg);}
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
  100%{transform:translateY(0);}
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(40px);}
  to{opacity:1;transform:translateY(0);}
}

/* ===== FADE OUT ===== */
.fade-out{
  animation:fadeOut 1s forwards;
}

@keyframes fadeOut{
  to{opacity:0;}
}

</style>
</head>
<body>

<section class="hero">

<div class="container" id="loader">
  <div class="glass">
    <img src="./assets/images/TourlyLogo.png" class="logo">
    <h1>Discover Destination</h1>
    <h1>Welcome to My Project</h1>
    
    <div class="loader"></div>
</div>
</div>
</section>

<script>
setTimeout(function(){
  document.getElementById("loader").classList.add("fade-out");
  setTimeout(function(){
    window.location.href="selectpage.html"; // change if needed
  },1000);
},5000);
</script>

</body>
</html>
